<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://assets.calendly.com" />
    <title>Svetlana Latiseva - Mortgages</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms: each form declared with data-netlify="true" and hidden
         so the build bot detects every field for dashboard + email notifications -->

    <form name="contact" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="fullName" />
      <input name="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="consent" />
    </form>

    <form name="careers" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="careers" />
      <input type="hidden" name="formType" value="Careers application" />
      <input name="fullName" />
      <input name="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="cv" type="file" />
      <input name="consent" />
    </form>

    <form name="refer-a-friend" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="refer-a-friend" />
      <input type="hidden" name="formType" value="Refer a friend" />
      <input name="yourName" />
      <input name="yourEmail" />
      <input name="friendName" />
      <input name="friendEmail" />
      <textarea name="message"></textarea>
      <input name="consent" />
    </form>

    <form name="purchase-quote" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="purchase-quote" />
      <input type="hidden" name="formType" value="Purchase quotation" />
      <input name="applicants" />
      <input name="title" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="purchasePrice" />
      <input name="tenure" />
      <textarea name="address"></textarea>
      <input name="firstTimeBuyer" />
      <input name="lender" />
      <textarea name="notes"></textarea>
      <input name="consentContact" />
      <input name="consentUpdates" />
    </form>

    <form name="sale-quote" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="sale-quote" />
      <input type="hidden" name="formType" value="Sale quotation" />
      <input name="applicants" />
      <input name="title" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="salePrice" />
      <input name="tenure" />
      <textarea name="address"></textarea>
      <input name="mortgageCount" />
      <textarea name="notes"></textarea>
      <input name="consentContact" />
      <input name="consentUpdates" />
    </form>

    <form name="sale-and-purchase-quote" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="sale-and-purchase-quote" />
      <input type="hidden" name="formType" value="Sale and purchase quotation" />
      <input name="applicants" />
      <input name="title" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="saleCountry" />
      <input name="salePrice" />
      <input name="saleTenure" />
      <textarea name="saleAddress"></textarea>
      <input name="saleMortgages" />
      <textarea name="saleNotes"></textarea>
      <input name="purchaseCountry" />
      <input name="purchasePrice" />
      <input name="purchaseTenure" />
      <textarea name="purchaseAddress"></textarea>
      <input name="firstTimeBuyer" />
      <input name="lender" />
      <textarea name="purchaseNotes"></textarea>
      <input name="consentContact" />
      <input name="consentUpdates" />
    </form>

    <form name="remortgage-quote" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="remortgage-quote" />
      <input type="hidden" name="formType" value="Remortgage quotation" />
      <input name="applicants" />
      <input name="title" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="propertyPrice" />
      <input name="tenure" />
      <textarea name="address"></textarea>
      <input name="lender" />
      <input name="mortgageCount" />
      <input name="loanAmount" />
      <textarea name="notes"></textarea>
      <input name="consentContact" />
      <input name="consentUpdates" />
    </form>

    <form name="survey-quote" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="survey-quote" />
      <input type="hidden" name="formType" value="Survey quotation" />
      <input name="title" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="surveyType" />
      <input name="propertyAge" />
      <textarea name="address"></textarea>
      <textarea name="notes"></textarea>
      <input name="consentContact" />
      <input name="consentUpdates" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
